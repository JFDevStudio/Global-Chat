<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña 🔑</title>
    <link rel="stylesheet" href="style.css?v=1.0.1">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
    <section class="auth-box">
        <h2 id="recovery-title">Nueva Contraseña 🔑</h2>
        <p id="recovery-subtitle" class="auth-subtitle">Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.</p>
        
        <form id="recovery-form">
            <div class="input-group">
                <label for="new-password">Nueva Contraseña</label>
                <input type="password" id="new-password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <button type="submit" id="recovery-submit-btn">Actualizar Contraseña 🚀</button>
        </form>

        <div id="recovery-success-box" class="account-created-box hidden">
            <h3>¡Contraseña Actualizada! ✨</h3>
            <p>Tu contraseña ha sido cambiada con éxito. Ya puedes volver a entrar al chat.</p>
            <button id="go-to-login-btn" class="secondary-btn">Ir al Login 🚪</button>
        </div>

        <p id="recovery-error" class="error-msg hidden"></p>
    </section>

    <script src="config.js?v=1.0.1"></script>
    <script src="recuperar.js?v=1.0.1"></script>
</body>
</html>
